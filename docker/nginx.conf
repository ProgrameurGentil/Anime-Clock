server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        # Une seule page : une adresse inconnue répond 404, pas la page d'accueil.
        try_files $uri $uri/ =404;
    }

    # Les fichiers changent à chaque version : le navigateur revalide au lieu de garder une vieille copie.
    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "no-cache";
    }
}
